<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06060a" />
    
    <!-- SEO Optimization -->
    <title>TutorialSync — Modernize Outdated Coding Tutorials</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif; background: #06060a; color: white; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
